name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: gmanka
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gmankab
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: login to quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: gmankab
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          tags: |
            quay.io/gmanka/arch-arm-toolbox:latest
            docker.io/gmanka/arch-arm-toolbox:latest
            ghcr.io/gmanka-containers/arch-arm-toolbox:latest

